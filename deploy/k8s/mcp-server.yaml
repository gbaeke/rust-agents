# Stateless (no MCP sessions), so it runs as several replicas from the start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mcp-server
          image: rust-agents/mcp-server:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_ADDR
              value: 0.0.0.0:8081
            # Host names the agent may use (DNS-rebinding protection).
            - name: MCP_ALLOWED_HOSTS
              value: mcp-server,mcp-server:8081,mcp-server.rust-agents,mcp-server.rust-agents:8081,mcp-server.rust-agents.svc.cluster.local,mcp-server.rust-agents.svc.cluster.local:8081
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector: { app: mcp-server }
  ports:
    - { name: http, port: 8081, targetPort: http }
