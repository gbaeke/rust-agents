apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rust-agents
resources:
  - namespace.yaml
  - postgres.yaml
  - mcp-server.yaml
  - agent.yaml
  - disruption-budgets.yaml
configMapGenerator:
  - name: agent-config
    literals:
      - AGENT_MODEL=claude-sonnet-5-5
      - AGENT_ADDR=0.0.0.0:3000
      - MCP_URL=http://mcp-server:8081/mcp
      - KB_DIR=/knowledge-base
