# This app's own agentgateway proxy (the controller is shared, installed by
# kind/agentgateway.sh). The agent reaches Claude and the MCP server only
# through it: the gateway holds the Anthropic key, and is the one place for
# token metrics, traces and policies on model and tool traffic. Models are
# AgentgatewayModels on the listener; MCP is a backend behind an HTTPRoute
# on /mcp of the same listener.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef: { group: agentgateway.dev, kind: AgentgatewayParameters, name: agentgateway }
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces: { from: Same }
        # A listener only takes the standard route kinds unless told otherwise.
        kinds:
          - { group: gateway.networking.k8s.io, kind: HTTPRoute }
          - { group: agentgateway.dev, kind: AgentgatewayModel }
---
# How the controller runs this Gateway's proxy: two replicas (the agent has
# three; one proxy would be a single point of failure), only reachable inside
# the cluster, and with the seccomp profile the restricted namespace requires.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: agentgateway
spec:
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          securityContext:
            seccompProfile: { type: RuntimeDefault }
  service:
    spec:
      type: ClusterIP
  # Request logs in Postgres (database `agentgateway`, made by deploy/deploy.sh):
  # the admin UI's Analytics and Logs pages show every LLM call from both
  # replicas. There is no typed field for it, so it goes in as raw config.
  env:
    - name: POSTGRES_PASSWORD
      valueFrom: { secretKeyRef: { name: postgres, key: password } }
  rawConfig:
    config:
      logging:
        database:
          url: postgres://agent:${POSTGRES_PASSWORD}@postgres:5432/agentgateway
---
# Claude, as a model the gateway serves on its standard paths, including
# Anthropic's own /v1/messages in Anthropic's format. Only declared models are
# served: a request for any other model is refused. The key comes from the
# Secret `anthropic` (made by deploy/deploy.sh) and replaces whatever key the
# client sends. Add one of these per model the agent may use (AGENT_MODEL).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: claude-sonnet-5-5
spec:
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: agentgateway, sectionName: http }
  provider: Anthropic
  policies:
    auth:
      secretRef:
        name: anthropic
---
# The MCP server. It keeps no sessions, so neither does the gateway: each
# request goes upstream on its own and any replica of either can serve it.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: mcp-server
spec:
  mcp:
    sessionRouting: Stateless
    targets:
      - name: tools
        static:
          host: mcp-server.rust-agents.svc.cluster.local
          port: 8081
          path: /mcp
          protocol: StreamableHTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs:
    - name: agentgateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /mcp }
      backendRefs:
        - { group: agentgateway.dev, kind: AgentgatewayBackend, name: mcp-server }
